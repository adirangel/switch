name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The build only ever reads the repo and uploads an artifact; no job needs write access.
permissions:
  contents: read

jobs:
  test:
    # The parser, config and hotkey logic live in a platform-neutral project, so they run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/ScreenSwitch.Tests/ScreenSwitch.Tests.csproj --configuration Release --nologo

  publish:
    # Produces the single .exe to download and run on both machines.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/ScreenSwitch/ScreenSwitch.csproj --configuration Release --runtime win-x64 --output publish

      - name: Upload the portable executable
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSwitch-win-x64
          path: publish/ScreenSwitch.exe
          if-no-files-found: error

      # Not preinstalled on the windows-latest image, so it has to be fetched.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        # ${env:...} braces are required: the parentheses in the variable name break bare $env: parsing.
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\ScreenSwitch.iss'

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSwitch-Setup
          path: installer-output/ScreenSwitch-Setup.exe
          if-no-files-found: error
