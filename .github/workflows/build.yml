name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The build only ever reads the repo and uploads an artifact; no job needs write access.
permissions:
  contents: read

jobs:
  test:
    # The parser, config and hotkey logic live in a platform-neutral project, so they run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/ScreenSwitch.Tests/ScreenSwitch.Tests.csproj --configuration Release --nologo

  publish:
    # Produces the single .exe to download and run on both machines.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/ScreenSwitch/ScreenSwitch.csproj --configuration Release --runtime win-x64 --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSwitch-win-x64
          path: publish/ScreenSwitch.exe
          if-no-files-found: error
